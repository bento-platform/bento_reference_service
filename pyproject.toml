[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "bento_reference_service"
requires-python = ">=3.12.0"

[tool.poetry]
name = "bento_reference_service"
version = "0.7.6"
description = "Reference data (genomes & annotations) service for the Bento platform."
authors = [
    "David Lougheed <david.lougheed@mail.mcgill.ca>",
]
readme = "README.md"
packages = [{include = "bento_reference_service"}]
include = [
    "bento_reference_service/workflows/wdls/*.wdl",
    "bento_reference_service/sql/*.sql",
]
repository = "https://github.com/bento-platform/bento_reference_service"
license = "LGPL-3.0-only"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Operating System :: OS Independent"
]

[tool.poetry.dependencies]
python = ">=3.12.0,<3.15"
fastapi = {extras = ["all"], version = "^0.162.0"}
pydantic = "^2.14.0"
bento-lib = {extras = ["fastapi"], version = "^18.1.4"}
aiofiles = "~25.1.0"
pysam = "~0.24.1"
jsonschema = "^4.23.0"
pydantic-settings = "^2.1.0"
asyncpg = "^0.32.0"
structlog = "^26.1.0"
orjson = "^3.11.8"

[tool.poetry.group.dev.dependencies]
aiointercept = "^1.0.0"
coverage = "^7.6.1"
debugpy = "^1.8.17"
httpx2 = "^2.3.0"
pytest = "^9.0.1"
pytest-asyncio = "^1.0.0"
pytest-cov = "^7.0.0"
fasta-checksum-utils = "^0.6.0"
ruff = "^0.17.2"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["RUF022"]
